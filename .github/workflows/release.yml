name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # main に pending changeset があれば "Release PR" を自動生成。
          # Release PR を merge 後は `publish-script: pnpm run release` が走り、build →
          # `changeset publish` で npm に公開する (provenance 付き)。
          # 認証は npm Trusted Publishing (OIDC) のみ。v2 は NPM_TOKEN から .npmrc を作らない。
          # GITHUB_TOKEN は action が script の env に渡す。env で別に設定すると
          # `github-token` 入力との食い違いで失敗するため、ここでは設定しない。
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify npm provenance attestation (post-publish smoke)
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # registry 反映の遅延を吸収するため短くリトライする
          PUBLISHED=""
          for i in 1 2 3 4 5; do
            if npm view "@seike460/minamo@${VERSION}" version >/dev/null 2>&1; then
              PUBLISHED=1
              break
            fi
            sleep 10
          done
          if [ -z "$PUBLISHED" ]; then
            echo "::error::@seike460/minamo@${VERSION} did not appear on npm registry"
            exit 1
          fi
          # publish 直後の artifact そのものを隔離環境に install して署名を検証する
          # (リポジトリの依存に対する `npm audit signatures` は本 package を検証しない)
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null
          npm install --ignore-scripts "@seike460/minamo@${VERSION}"
          npm audit signatures
