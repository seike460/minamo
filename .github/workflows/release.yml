name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          # main に pending changeset があれば "Release PR" を自動生成。
          # Release PR を merge 後は `publish: pnpm run release` が走り、build →
          # `changeset publish` → `pnpm publish --provenance` で npm に公開する。
          # Trusted Publishing (OIDC) が npm 側で登録済なら NPM_TOKEN は fallback。
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify npm provenance attestation (post-publish smoke)
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # registry 反映の遅延を吸収するため短くリトライする
          PUBLISHED=""
          for i in 1 2 3 4 5; do
            if npm view "@seike460/minamo@${VERSION}" version >/dev/null 2>&1; then
              PUBLISHED=1
              break
            fi
            sleep 10
          done
          if [ -z "$PUBLISHED" ]; then
            echo "::error::@seike460/minamo@${VERSION} did not appear on npm registry"
            exit 1
          fi
          # publish 直後の artifact そのものを隔離環境に install して署名を検証する
          # (リポジトリの依存に対する `npm audit signatures` は本 package を検証しない)
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null
          npm install "@seike460/minamo@${VERSION}"
          npm audit signatures
